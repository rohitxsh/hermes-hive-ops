# ~/.config/hermes-sealed-env.conf  (ENV_NAME credential_name). Seal each credential first (README: Secrets).
OPENROUTER_API_KEY openrouter_api_key
SUPABASE_ACCESS_TOKEN supabase_access_token
# Pay-per-use API fallbacks (fallback_providers entries with key_env). Use ANTHROPIC_TOKEN, not ANTHROPIC_API_KEY:
# the Claude subscription plugin refuses to run while ANTHROPIC_API_KEY is set. Both names are stripped from agent terminals.
# OPENAI_API_KEY openai_api_key
# ANTHROPIC_TOKEN anthropic_api_key
