# Effort routing for Hermes helper agents (delegate_task), per team profile. Needs the official plugin:
#   hermes -p <profile> plugins install advanced-delegation --yes && hermes -p <profile> plugins enable advanced-delegation
# then set these two keys with `hermes -p <profile> config set` (delegation.backends.model_map takes JSON) or paste them.
# The agent sees only the route names and descriptions and picks one per helper task; the default covers the rest.
# Models: keep to the current lineup. Coding CLI runs (Claude Code / Codex) are sized separately by ops-core rule 53.
delegation:
  backend: model_map
  backends:
    model_map:
      default: standard
      options:
        - name: fast
          description: "Quick, low-risk work: lookups, summaries, reading or listing things, simple checks, small mechanical edits."
          provider: openai-codex
          model: gpt-6.1-terra
          reasoning_effort: low
          fallback_providers: [{provider: claude-subscription-directsdk-experimental, model: claude-sonnet-5-5}]
        - name: standard
          description: "Normal work: a focused change or investigation inside one area, drafting, routine reviews."
          provider: openai-codex
          model: gpt-6.1-sol
          reasoning_effort: medium
          fallback_providers: [{provider: claude-subscription-directsdk-experimental, model: claude-sonnet-5-5}]
        - name: deep
          description: "Hard or risky work: debugging after a failed attempt, architecture and design decisions, security, data or money, final reviews."
          provider: openai-codex
          model: gpt-6.1-sol
          reasoning_effort: high
          fallback_providers: [{provider: claude-subscription-directsdk-experimental, model: "claude-opus-5-5[1m]"}]
